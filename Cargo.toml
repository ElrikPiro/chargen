[workspace]
members = ["crates/chargen-domain", "crates/chargen-engine", "crates/chargen-store", "crates/chargen-query", "crates/chargen-app"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.90"
license-file = "LICENSE"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.17"
rusqlite = { version = "=0.37.0", features = ["bundled", "backup"] }
axum = "=0.8.6"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }
chargen-domain = { path = "crates/chargen-domain" }
chargen-engine = { path = "crates/chargen-engine" }
chargen-store = { path = "crates/chargen-store" }
chargen-query = { path = "crates/chargen-query" }

[profile.release]
lto = "thin"
codegen-units = 1
