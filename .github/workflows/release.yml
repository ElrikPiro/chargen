name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
            executable: chargen-app
          - os: windows-2022
            target: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
            executable: chargen-app.exe
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Build standalone release executable
        run: cargo +1.90.0 build --release --package chargen-app --locked --target ${{ matrix.rust_target }}
      - name: Package executable and documentation
        env:
          CHARGEN_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}
          CHARGEN_TARGET: ${{ matrix.target }}
          CHARGEN_RUST_TARGET: ${{ matrix.rust_target }}
          CHARGEN_COMMIT: ${{ github.sha }}
        run: sh scripts/package.sh
      - name: Extract and smoke test the release package
        shell: bash
        run: |
          mkdir -p target/package-smoke
          archive="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          tar -xzf "$archive" -C target/package-smoke
          package_dir="$(find target/package-smoke -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -f "$package_dir/MANIFEST.json"
          test -f "$package_dir/${{ matrix.executable }}"
          node scripts/check-package.mjs "$package_dir" "${{ matrix.target }}" "${{ matrix.executable }}"
          node scripts/smoke-api.mjs "$package_dir/${{ matrix.executable }}"
          node scripts/validate-e1.mjs "$package_dir/${{ matrix.executable }}"
      - name: Upload platform release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chargen-release-${{ matrix.target }}
          path: |
            dist/chargen-*.tar.gz
            dist/chargen-*.tar.gz.sha256
            dist/chargen-*.manifest.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish checksummed release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.2
      - name: Download platform release files
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: chargen-release-*
          path: release-assets
          merge-multiple: true
      - name: Assemble release manifest and checksums
        run: node scripts/assemble-release-manifest.mjs release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --title "$GITHUB_REF_NAME" --generate-notes
